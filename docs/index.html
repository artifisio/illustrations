<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifisio Illustrations Registry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2a2a33;
      --text: #e8e8f0;
      --text-muted: #7a7a8a;
      --accent: #7c6af7;
      --accent-hover: #9585ff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    header {
      padding: 2rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
    .badge { background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 0.75rem; color: var(--text-muted); }

    .search-bar { padding: 1.25rem 2rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .search-bar input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.5rem 0.875rem; font-size: 0.875rem; width: 260px; outline: none; }
    .search-bar input:focus { border-color: var(--accent); }

    main { padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .sets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

    .set-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      transition: border-color 0.15s;
    }
    .set-card:hover { border-color: var(--accent); }
    .set-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
    .set-header h2 { font-size: 1rem; font-weight: 600; }
    .set-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem; flex-wrap: wrap; }
    .tag { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.125rem 0.5rem; font-size: 0.7rem; color: var(--text-muted); }
    .count { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }

    .palette-bar { padding: 0.625rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; min-height: 2.5rem; }
    .palette-slot { display: flex; align-items: center; gap: 0.375rem; font-size: 0.7rem; color: var(--text-muted); }
    .palette-slot input[type="color"] { width: 20px; height: 20px; border: none; border-radius: 50%; cursor: pointer; background: none; padding: 0; appearance: none; -webkit-appearance: none; }
    .palette-slot input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
    .palette-slot input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; }

    .ills-grid { padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem; }
    .ill-item { aspect-ratio: 1; background: var(--bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
    .ill-item svg { width: 100%; height: 100%; }
    .ill-item img { width: 100%; height: 100%; object-fit: contain; }
    .ill-item .ill-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.6rem; padding: 0.15rem 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.15s; }
    .ill-item:hover .ill-label { opacity: 1; }
    .ill-loading { width: 100%; height: 100%; background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .no-results { text-align: center; color: var(--text-muted); padding: 4rem 2rem; }

    .cli-hint { margin-top: 0.5rem; padding: 0.5rem 1.25rem; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--text-muted); font-family: monospace; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Artifisio Illustrations</h1>
      <p>Open-source registry · <strong>21 sets</strong> · <strong>461 illustrations</strong></p>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
      <span class="badge">v2026.08.31-1038-63b355c</span>
      <a href="https://artifisio.com" class="badge">artifisio.com ↗</a>
      <a href="https://www.npmjs.com/package/artifisio" class="badge">artifisio ↗</a>
    </div>
  </header>

  <div class="search-bar">
    <input type="search" id="search" placeholder="Search sets…" autocomplete="off" />
    <span style="font-size:0.8rem;color:var(--text-muted)">Click palette swatches to preview colours</span>
  </div>

  <main>
    <div class="sets-grid" id="sets-grid">
      <div class="no-results">Loading…</div>
    </div>
  </main>

  <footer>
    Illustrations by <a href="https://artifisio.com">Artifisio</a> · Registry version <code>2026.08.31-1038-63b355c</code> · <a href="../LICENSE">License</a>
  </footer>

  <script type="module">
    const CDN = 'https://cdn.jsdelivr.net/gh/artifisio/illustrations@main'
    const MANIFEST_URL = '../manifest.json'

    // Inline injectSvgCssVars to avoid external dependency in the gallery
    function injectCssVars(svgText, palette, userColors) {
      const overrides = palette
        .filter(s => s.role === 'themeable' && userColors[s.slot])
        .map(s => `--artf-${s.slot}: ${userColors[s.slot]}`)
      if (!overrides.length) return svgText
      const styleValue = overrides.join('; ')
      if (/style\s*=\s*["']/.test(svgText.slice(0, 500))) {
        return svgText.replace(/(<svg[^>]*style\s*=\s*["'])/, `$1${styleValue}; `)
      }
      return svgText.replace(/(<svg\b)/, `$1 style="${styleValue}"`)
    }

    // Per-set colour overrides (slot → hex)
    const paletteState = {}

    async function loadSvg(setSlug, illSlug) {
      const url = `${CDN}/sets/${setSlug}/svg/${illSlug}.svg`
      try {
        const res = await fetch(url)
        if (!res.ok) return null
        return await res.text()
      } catch {
        return null
      }
    }

    function applyCssVars(container, palette, colors) {
      const svgEls = container.querySelectorAll('.ill-svg-host')
      for (const host of svgEls) {
        const original = host.dataset.original
        if (!original) continue
        const themed = injectCssVars(original, palette, colors)
        host.innerHTML = themed
      }
    }

    function renderSet(slug, setMeta) {
      const card = document.createElement('div')
      card.className = 'set-card'
      card.dataset.slug = slug
      card.dataset.name = setMeta.name.toLowerCase()
      card.dataset.tags = (setMeta.tags ?? []).join(' ').toLowerCase()

      const palette = setMeta.palette ?? []
      if (!paletteState[slug]) {
        paletteState[slug] = Object.fromEntries(
          palette.filter(s => s.role === 'themeable').map(s => [s.slot, s.hex])
        )
      }

      const paletteHtml = palette.length
        ? palette
            .filter(s => s.role === 'themeable')
            .map(s => `<label class="palette-slot" title="${s.label}">
              <input type="color" data-slot="${s.slot}" value="${paletteState[slug][s.slot] ?? s.hex}" />
              ${s.label}
            </label>`)
            .join('')
        : '<span style="font-size:0.7rem;color:var(--text-muted)">No palette</span>'

      const illsToShow = setMeta.illustrations.slice(0, 12)
      const illsHtml = illsToShow
        .map(ill => `<div class="ill-item" title="${ill.slug}">
          <div class="ill-loading" id="ill-${slug}-${ill.slug}"></div>
          <span class="ill-label">${ill.slug}</span>
        </div>`)
        .join('')

      card.innerHTML = `
        <div class="set-header">
          <h2>${setMeta.name}</h2>
          <div class="set-meta">
            ${(setMeta.tags ?? []).map(t => `<span class="tag">${t}</span>`).join('')}
            <span class="count">${setMeta.count} illustrations</span>
          </div>
        </div>
        <div class="palette-bar" data-set="${slug}">${paletteHtml}</div>
        <div class="ills-grid" data-set="${slug}">${illsHtml}</div>
        <div class="cli-hint">npx artifisio add ${slug}</div>
      `

      // Wire palette pickers
      card.querySelectorAll('input[type="color"]').forEach(input => {
        input.addEventListener('input', () => {
          const slot = input.dataset.slot
          paletteState[slug][slot] = input.value
          const container = card.querySelector('.ills-grid')
          applyCssVars(container, palette, paletteState[slug])
        })
      })

      // Async-load illustrations
      ;(async () => {
        for (const ill of illsToShow) {
          const placeholder = document.getElementById(`ill-${slug}-${ill.slug}`)
          if (!placeholder) continue
          const svgText = await loadSvg(slug, ill.slug)
          if (!svgText) continue
          const host = document.createElement('div')
          host.className = 'ill-svg-host'
          host.dataset.original = svgText
          const themed = injectCssVars(svgText, palette, paletteState[slug])
          host.innerHTML = themed
          placeholder.replaceWith(host)
        }
      })()

      return card
    }

    async function init() {
      const grid = document.getElementById('sets-grid')
      const searchInput = document.getElementById('search')

      let manifest
      try {
        const res = await fetch(MANIFEST_URL)
        manifest = await res.json()
      } catch (e) {
        grid.innerHTML = '<div class="no-results">Failed to load manifest.json.</div>'
        return
      }

      const cards = []
      for (const [slug, setMeta] of Object.entries(manifest.sets)) {
        const card = renderSet(slug, setMeta)
        cards.push(card)
      }

      grid.innerHTML = ''
      for (const card of cards) grid.appendChild(card)

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase()
        let visible = 0
        for (const card of grid.children) {
          const match = !q || card.dataset.name.includes(q) || card.dataset.tags.includes(q) || card.dataset.slug.includes(q)
          card.style.display = match ? '' : 'none'
          if (match) visible++
        }
        // show no-results if nothing matches
        let noResults = grid.querySelector('.no-results')
        if (visible === 0 && !noResults) {
          noResults = document.createElement('div')
          noResults.className = 'no-results'
          noResults.textContent = 'No sets match your search.'
          grid.appendChild(noResults)
        } else if (visible > 0 && noResults) {
          noResults.remove()
        }
      })
    }

    init()
  </script>
</body>
</html>
